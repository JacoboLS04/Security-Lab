rules:
  # ---------------------------------------------------------------------------
  # Reglas de seguridad personalizadas para el frontend Angular/TypeScript de OPC.
  # ---------------------------------------------------------------------------

  - id: opc-ts-secretos-hardcodeados
    languages:
      - typescript
    severity: ERROR
    message: |
      Secreto/credencial fijado en codigo del frontend (CWE-540/CWE-798).
      Todo lo que se compila en el bundle Angular es publico: un JWT secret,
      una API key del backend o una clave simetrica no pueden vivir en
      environments/*. Evidencia: src/environments/environment.ts y
      environment.prod.ts (jwtSharedSecret, erpApiKey). Correccion: eliminar
      del bundle; el backend no debe confiar en secretos presentes en el
      cliente. Solo pueden permanecer claves publicas por diseno (ej. mapsPublicKey).
    metadata:
      category: security
      cwe:
        - "CWE-540: Inclusion of Sensitive Information in Source Code"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
    patterns:
      - pattern: "$CLAVE: $VALOR"
      - metavariable-regex:
          metavariable: $CLAVE
          regex: (?i).*(key|secret|token|password).*
      - metavariable-pattern:
          metavariable: $VALOR
          pattern-regex: (?i)^["']
      - metavariable-pattern:
          metavariable: $CLAVE
          pattern-regex: (?i)^(?!.*public).*$

  - id: opc-ts-innerhtml-inseguro
    languages:
      - typescript
    severity: WARNING
    message: |
      Uso de [innerHTML] con contenido arbitrario (CWE-79, OWASP A03:2021).
      Al inyectar HTML directamente se desactiva la sanitizacion de Angular.
      Evidencia: login.component.ts:15 (error del backend), admin-console
      preview, ticket-detail [innerHTML] sobre marked. Correccion: usar
      interpolacion {{ }} (escapa por defecto) o sanitizar el HTML antes.
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp:
        - "A03:2021 - Injection"
      confidence: MEDIUM
    pattern-regex: \[innerHTML\]="[^"]*"

  - id: opc-ts-marked-inseguro
    languages:
      - typescript
    severity: WARNING
    message: |
      marked.parse() sobre contenido que luego se inyecta con [innerHTML]
      (CWE-79). marked (4.0.10) no sanitiza HTML embebido en el Markdown; el
      texto del ticket/comentario puede convertirse en HTML ejecutable.
      Evidencia: ticket-detail.component.ts:30 y :34 -> [innerHTML] en el html.
      Correccion: sanitizar la salida (DOMPurify) o renderizar sin HTML.
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp:
        - "A03:2021 - Injection"
      confidence: MEDIUM
    pattern-either:
      - pattern: marked.parse($TEXTO)
      - pattern: marked($TEXTO)

  - id: opc-ts-bypass-security-trust
    languages:
      - typescript
    severity: ERROR
    message: |
      bypassSecurityTrustHtml marca HTML como confiable para [innerHTML]
      anulando la sanitizacion de Angular (CWE-79, OWASP A03:2021).
      Evidencia: shared/safe-html.pipe.ts:14, usado junto a marked y al HTML
      que arma el backend. Correccion: no usar la pipe; sanitizar antes de
      renderizar (apoyo del frontend al triage de store/reflected XSS).
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp:
        - "A03:2021 - Injection"
      confidence: LOW
    pattern: $OBJ.bypassSecurityTrustHtml($ARG)