rules:
  # ---------------------------------------------------------------------------
  # Reglas de seguridad personalizadas para el backend Python/Flask de OPC.
  # Concepto por regla: Problema -> Patron -> Finding esperado -> Triage.
  # Semgrep trabaja sobre la estructura sintactica (AST), no sobre el flujo de
  # datos del programa: estas reglas detectan patrones; la confirmacion de
  # explotabilidad queda para el triage manual (docs/triage.md).
  # ---------------------------------------------------------------------------

  - id: opc-python-sql-construccion-manual
    languages:
      - python
    severity: ERROR
    message: |
      Consulta SQL construida por concatenacion/interpolacion con datos
      variables (operador '%', .format() o '+'). Cualquiera de estos caminos
      puede introducir una inyeccion SQL (CWE-89) si el dato aportado por el
      usuario no esta previamente validado contra un conjunto cerrado.
      Evidencia conocida en el codigo: api/admin.py:52, api/reports.py:35,
      api/tickets.py:35 y :105, api/users.py:30, services/search_service.py:16.
      Correccion: usar siempre consultas parametrizadas ('?') o validar la
      entrada contra un conjunto finito de valores permitidos.
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      confidence: MEDIUM
      technology:
        - flask
    patterns:
      - pattern-either:
          - pattern: $SQL = $CADENA % $DATOS
          - pattern: $SQL = $CADENA.format($DATOS)
          - pattern: $SQL = $CADENA + $ALGO
      - metavariable-regex:
          metavariable: $CADENA
          regex: (?i).*(select|insert|update|delete).*

  - id: opc-python-inyeccion-comando
    languages:
      - python
    severity: ERROR
    message: |
      Ejecucion de comandos del sistema con shell=True, os.system o
      subprocess.getoutput por datos no validados. Permite inyeccion de
      comandos (CWE-78, OWASP A03:2021) y, si el endpoint no exige
      autenticacion, ejecucion remota de codigo (RCE).
      Evidencia: api/admin.py:67 (ping con 'host' concatenado),
      services/export_service.py:48 (formato_destino), api/internal.py:35
      (cmd). Correccion: nunca interpolar datos del usuario; pasar listas de
      argumentos sin shell y validar contra allowlist.
    metadata:
      category: security
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
      technology:
        - flask
        - subprocess
    pattern-either:
      - pattern: |
          subprocess.$FUNC($CMD, ..., shell=True, ...)
      - pattern: os.system($CMD)
      - pattern: subprocess.getoutput($CMD)

  - id: opc-python-path-traversal-apertura
    languages:
      - python
    severity: ERROR
    message: |
      Apertura/envio de archivo construido con os.path.join sobre un directorio
      base sin normalizar el nombre. Si el nombre proviene del usuario y no se
      valida antes, un atacante puede leer/escribir fuera del directorio
      previsto (path traversal, CWE-22). Evidencia: api/files.py:47 (preview) y
      :26 (descargar con unquote posterior a la validacion). Correccion: usar
      werkzeug.security.safe_join + secure_filename (o validar el nombre contra
      un patron cerrado) y reservar esos endpoints con @require_auth.
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp:
        - "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      technology:
        - flask
    patterns:
      - pattern: $RUTA = os.path.join($DIR, $NOMBRE)

  - id: opc-python-pickle-inseguro
    languages:
      - python
    severity: ERROR
    message: |
      Deserializacion con pickle.loads de datos aportados por el usuario.
      pickle es inseguro frente a gadgets: un payload malicioso puede ejecutar
      codigo arbitrario al deserializar (CWE-502, OWASP A08:2021).
      Evidencia: api/importar.py -> services/import_service.py:18 (y :31 con
      firma). Correccion: sustituir por formatos seguros (JSON) o, si debe
      conservarse, restringirlo a un administrador y una clave de firma real.
    metadata:
      category: security
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      technology:
        - flask
    pattern: pickle.loads($DATOS)

  - id: opc-python-aes-ecb
    languages:
      - python
    severity: WARNING
    message: |
      Uso de AES en modo ECB (CWE-327/CWE-1130). ECB cifra cada bloque de 16
      bytes de forma independiente: los patrones de los datos se conservan y
      permiten ataques de analisis de bloques. Evidencia:
      core/security.py:96 y :103 (FIELD_ENCRYPTION_KEY). Correccion: usar
      AES-GCM (o al menos CBC con IV aleatorio por operacion).
    metadata:
      category: security
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
        - "CWE-1130: Insufficient Entropy"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern-either:
      - pattern: AES.new($CLAVE, AES.MODE_ECB)

  - id: opc-python-md5-crypto
    languages:
      - python
    severity: WARNING
    message: |
      Uso de MD5 (CWE-327). MD5 no es resistente a colisiones y no debe usarse
      como hash de contrasenas ni en contextos criptograficos (firmas, MAC).
      Evidencia: core/security.py:22 y :27 (hash_password/verificar_password).
      Triage necesario: en services/cache_service.py (claves de cache y
      checksum) MD5 se usa con fin NO criptografico -> descartar alli. En
      contrasenas -> reemplazar por hashlib.scrypt/pbkdf2 o bcrypt/argon2.
    metadata:
      category: security
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern-either:
      - pattern: hashlib.md5($TEXTO.encode($ENC))
      - pattern: h = hashlib.md5()
      - pattern: hashlib.md5($TEXTO)

  - id: opc-python-entropia-debil-token
    languages:
      - python
    severity: ERROR
    message: |
      Semilla aleatoria derivada del reloj (random.seed(int(time.time())))
      para generar el codigo de recuperacion de contrasena. Los codigos son
      predecibles (CWE-331 / CWE-338): un atacante puede regenerar la secuencia
      y tomar la contrasena de cualquier usuario. Evidencia:
      core/security.py:43 (generar_token_reset). Correccion: usar secrets
      (secrets.randbelow / secrets.token_hex) y comparar con secrets.compare_digest.
    metadata:
      category: security
      cwe:
        - "CWE-331: Insufficient Entropy"
        - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern: random.seed(int(time.time()))

  - id: opc-python-secretos-hardcodeados
    languages:
      - python
    severity: WARNING
    message: |
      Secreto/credencial fijado en el codigo o valor por defecto de un secreto
      (CWE-798 / CWE-256). Evidencia conocida en config.py: SECRET_KEY, JWT_SECRET,
      SMTP_PASSWORD, AWS_*, INTERNAL_API_KEY, FIELD_ENCRYPTION_KEY. Correccion:
      inyectarlos por variable de entorno / gestor de secretos y no incluirlos
      en el repositorio.
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-256: Plaintext Storage of a Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: LOW
    patterns:
      - pattern: $CLAVE = $VALOR
      - metavariable-regex:
          metavariable: $CLAVE
          regex: (?i).*(secret|password|api_key|jwt|token).*
      - metavariable-pattern:
          metavariable: $VALOR
          pattern-regex: (?i)^b?["'].*["']$

  - id: opc-python-secreto-por-defecto
    languages:
      - python
    severity: WARNING
    message: |
      Secreto cargado con entorno pero con valor por defecto hardcodeado
      (CWE-256). Si la variable no esta definida se usa el valor literal del
      codigo: es un secreto de respaldo predecible. Evidencia: config.py:13
      (SECRET_KEY con default "opc_super_secret_2024"). Correccion: exigir la
      variable sin default (os.environ[...]) o fallar si no existe.
    metadata:
      category: security
      cwe:
        - "CWE-256: Plaintext Storage of a Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
    patterns:
      - pattern: $CLAVE = os.environ.get($VAR, $DEFECTO)
      - metavariable-regex:
          metavariable: $CLAVE
          regex: (?i).*(secret|password|api_key|jwt|token).*
      - metavariable-pattern:
          metavariable: $DEFECTO
          pattern-regex: (?i)^["']

  - id: opc-python-tls-sin-verificar
    languages:
      - python
    severity: WARNING
    message: |
      Verificacion de TLS desactivada (CWE-295). Deshabilitar la validacion del
      certificado permite ataques de intermediario (MITM) sobre credenciales o
      datos. Evidencia: services/notification_service.py:22
      (ssl._create_unverified_context) y :36 (requests verify=False).
      Correccion: usar contextos verificados (ssl.create_default_context) y
      verify=True.
    metadata:
      category: security
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern-either:
      - pattern: requests.$METODO($URL, ..., verify=False, ...)
      - pattern: ssl._create_unverified_context()

  - id: opc-python-cors-permisivo
    languages:
      - python
    severity: WARNING
    message: |
      Configuracion CORS permisiva (CWE-942 / OWASP A05:2021). Permitir
      cualquier origen (CORS_ORIGINS = '*') junto con supports_credentials=True
      permite a sitios maliciosos leer respuestas autenticadas del navegador.
      Evidencia: config.py:49 y app.py:40-44. Correccion: fijar la lista exacta
      de origenes del frontend y credenciales solo para esos.
    metadata:
      category: security
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
    pattern-either:
      - pattern: CORS_ORIGINS = "*"
      - pattern: origins=Config.CORS_ORIGINS
      - pattern: supports_credentials=True
      - pattern: 'origins: "*"'

  - id: opc-python-exposicion-traceback
    languages:
      - python
    severity: INFO
    message: |
      Se devuelven trazas, detalles de error o configuracion interna en la
      respuesta (CWE-209, OWASP A05:2021). Expone rutas, versiones, consultas y
      configuracion que facilitan el reconocimiento del atacante. Evidencia:
      core/errors.py:20-36 (traceback + DB_PATH + DEBUG en el 500).
      Correccion: registrar la traza en el log y devolver un mensaje generico.
    metadata:
      category: security
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
    patterns:
      - pattern: traceback.format_exc()

  - id: opc-python-debug-produccion
    languages:
      - python
    severity: INFO
    message: |
      Aplicacion ejecutada con debug/flask dev server conectado a 0.0.0.0
      (CWE-453). DEBUG=True reexpone la consola de trazas; el servidor de
      desarrollo de Flask no debe ser el servidor de produccion.
      Evidencia: app.py:96 y Config.DEBUG (config.py:51).
    metadata:
      category: security
      cwe:
        - "CWE-453: Insecure Default"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM
    pattern-either:
      - pattern: app.run(host=..., port=..., debug=Config.DEBUG)
      - pattern: app.run(..., debug=True)
      - pattern: DEBUG = os.environ.get($VAR, "1") == "1"