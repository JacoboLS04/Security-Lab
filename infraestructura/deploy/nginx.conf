# =============================================================================
# Configuracion completa de Nginx para el balanceador de OPC Tickets.
#
# Se monta sobre /etc/nginx/nginx.conf (reemplaza el archivo de la imagen):
#
#   Por que worker_processes 1?
#     Con "auto" (default) cada worker mantiene su propio contador round-robin.
#     En hosts con varios nucleos, rafagas cortas de peticiones pueden caer
#     mayoritariamente sobre una misma replica, lo que confunde la demostracion
#     del balanceo. Con un unico worker, round-robin alterna de forma estricta
#     y predecible, suficiente para el volumen de este laboratorio.
#
#   El proceso ya corre como usuario no-root (imagen nginx-unprivileged).
# =============================================================================

worker_processes 1;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Incluye $upstream_addr: permite ver hacia que replica fue cada peticion.
    log_format opc_format '$remote_addr - $upstream_addr "$request" $status '
                          'upstream_time=$upstream_response_time';

    access_log /dev/stdout opc_format;
    error_log /dev/stderr notice;

    sendfile on;
    keepalive_timeout 65;

    upstream opc_backend {
        # Round-robin (algoritmo por defecto). app1/app2 son los nombres de
        # servicio de Compose (DNS interno dela red).
        server app1:5000;
        server app2:5000;
    }

    server {
        listen 8080;
        server_name _;

        access_log /dev/stdout opc_format;
        error_log /dev/stderr info;

        # Uploads de adjuntos (limite que la API ya impone en bytes).
        client_max_body_size 25m;

        # Proba el balanceador en si, sin tocar el backend (healthcheck de lb).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://opc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header X-Replica $upstream_addr always;
        }
    }
}